[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mac-vendors-client"
version = "1.1.0"
description = "Lightweight offline MAC -> vendor lookup against an exported SQLite database"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "LizardSystems", email = "support@lizardsystems.com" }
]
keywords = [
    "mac-address",
    "oui",
    "ieee",
    "vendor",
    "lookup",
    "offline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
# No runtime dependencies: reads the exported SQLite via the stdlib sqlite3.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/mac-vendors/mac-vendors-client"
Repository = "https://github.com/mac-vendors/mac-vendors-client.git"

[tool.hatch.build.targets.wheel]
packages = ["src/mac_vendors_client"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mac_vendors_client"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
